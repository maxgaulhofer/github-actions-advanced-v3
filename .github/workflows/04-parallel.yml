name: Lab 04 parallel checks
on:
  workflow_dispatch:
    inputs:
      fail-test:
        description: Fail the test branch after its tests pass (failure-propagation experiment)
        type: boolean
        default: false
permissions: {}
cache-mode: none
jobs:
  sequential:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
  shared-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: app

      - parallel:
          - name: lint
            run: npm run lint
          - name: test
            run: npm test
      - run: npm run build
        working-directory: app

          
  separate-runners:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: app
      # - name: Complete isolated checks
      #   # TODO: Add a `strategy.matrix` to this job so lint and test each run in
      #   # their own job on a separate runner, then replace this placeholder with
      #   # one step that runs the check for the current matrix value.
      #   # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations
      #   # The steps above already give each runner its own checkout, Node setup
      #   # and dependency installation. separate-build already waits for this job.
      #   # In the test job, run real tests, then deliberately fail when fail-test
      #   # is true. Compare setup overhead and total runner time with the other jobs.
      #   run: |
      #     echo 'TODO: Run lint and test on separate runners, including the fail-test experiment.' >&2
      #     exit 1
    strategy:
      matrix:
        jobs: [lint, test]
        os: [ubuntu-latest, windows-latest]
        
  separate-build:
    needs: separate-runners
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run build
        working-directory: app
